<div [@slideDown] class="filter-container">
  <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="filter-form">
     <h2 class="filter-title">Unlock Your Next Home with Ease</h2>
    <!-- Location -->
     <div class="search-bar" >   
      <div class = "filters">
         <mat-form-field appearance="outline" class="search-field">
            <mat-label>Location</mat-label>
            <input matInput formControlName="city" placeholder="Enter city or area">
         </mat-form-field>

         <!-- Property Type -->
         <mat-form-field appearance="outline" class="search-field">
            <mat-label>Type</mat-label>
            <mat-select formControlName="type">
            <mat-option value="">All</mat-option>
            <mat-option value="flat">Flat</mat-option>
            <mat-option value="room">Room</mat-option>
            <mat-option value="house">House</mat-option>
            <mat-option value="apartment">Apartment</mat-option>
            </mat-select>
         </mat-form-field>

         <!-- Min Price -->
         <mat-form-field appearance="outline" class="search-field">
            <mat-label>Min Price</mat-label>
            <input matInput type="number" formControlName="minPrice" placeholder="Enter min price">
         </mat-form-field>

         <!-- Max Price -->
         <mat-form-field appearance="outline" class="search-field">
            <mat-label>Max Price</mat-label>
            <input matInput type="number" formControlName="maxPrice" placeholder="Enter max price">
         </mat-form-field>

         <!-- Availability -->
         <mat-slide-toggle formControlName="available">Available</mat-slide-toggle>
        </div> 

         <!-- Buttons -->
         <div class="search-buttons">
            <button mat-raised-button color="primary" type="submit">Search</button>
            <button mat-button type="button" (click)="resetFilters()">Reset</button>
         </div>
    </div>
  </form>
</div>


<div class="property-grid" [@slideDown]>
   <mat-grid-list cols="5" rowHeight="600px">
      <mat-grid-tile *ngFor = "let property of filteredProperties">
         <app-property-card [property]="property"></app-property-card>
      </mat-grid-tile>
   </mat-grid-list>
  <button *ngIf="(user$ | async)?.role === 'admin' || (user$ | async)?.role === 'owner'" mat-fab color="accent" class="add-property-btn" (click)="addProperty()" [@popIn]>
  <mat-icon>add</mat-icon>
</button>
</div>

      <h3>CasaConnect</h3>
